# metadata/org-profile.yaml is the canonical org-shared metadata registry
# (ADR 0014). scripts/generate_org_profile.py derives four artifacts from it: the
# org front-door profile/README.md (badge tables + install snippets),
# metadata/generated/registry.json (the machine-readable projection cross-repo
# consumers read), and the bounded contact/SLA regions of SECURITY.md and
# SUPPORT.md (AAASM-5520). This gate fails if any derived artifact has drifted
# from what the generator would produce — on any PR/push that touches the
# registry, the generator, or a generated artifact, and weekly to catch stealth
# hand-edits.
name: Org profile drift check

on:
  pull_request:
    branches: [main]
    paths:
      - metadata/org-profile.yaml
      - metadata/generated/registry.json
      - scripts/generate_org_profile.py
      - profile/README.md
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - .github/workflows/org-profile-drift.yml
  push:
    branches: [main]
    paths:
      - metadata/org-profile.yaml
      - metadata/generated/registry.json
      - scripts/generate_org_profile.py
      - profile/README.md
      - SECURITY.md
      - SUPPORT.md
      - CODE_OF_CONDUCT.md
      - .github/workflows/org-profile-drift.yml
  schedule:
    - cron: "23 6 * * 1"  # Mondays — catch stealth hand-edits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: generated artifacts match the registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # No PyYAML / third-party deps — the generator uses stdlib only, so the
      # runner's built-in python3 is sufficient.
      - name: Show Python version
        run: python3 --version

      - name: Run generator in --check mode
        run: python3 scripts/generate_org_profile.py --check
