# profile/README.md is the org front door (rendered by GitHub at
# github.com/ai-agent-assembly). Its per-SDK badge tables and install snippets
# are generated from metadata/org-profile.yaml by scripts/generate_org_profile.py.
# This gate fails if the bounded blocks in profile/README.md have drifted from
# what the generator would produce — on any PR/push that touches the SoT, the
# generator, or the README itself, and weekly to catch drift introduced by
# hand-edits or by an unnoticed generator change.
name: Org profile drift check

on:
  pull_request:
    branches: [master]
    paths:
      - metadata/org-profile.yaml
      - scripts/generate_org_profile.py
      - profile/README.md
      - .github/workflows/org-profile-drift.yml
  push:
    branches: [master]
    paths:
      - metadata/org-profile.yaml
      - scripts/generate_org_profile.py
      - profile/README.md
      - .github/workflows/org-profile-drift.yml
  schedule:
    - cron: "23 6 * * 1"  # Mondays — catch stealth hand-edits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: profile/README.md matches SoT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # No PyYAML / third-party deps — the generator uses stdlib only, so the
      # runner's built-in python3 is sufficient.
      - name: Show Python version
        run: python3 --version

      - name: Run generator in --check mode
        run: python3 scripts/generate_org_profile.py --check
