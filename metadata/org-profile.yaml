# Source of truth for the org-profile README (profile/README.md).
#
# This file drives the generator at scripts/generate_org_profile.py, which
# rewrites bounded <!-- BEGIN GENERATED: <id> --> ... <!-- END GENERATED: <id> -->
# sections in profile/README.md. The generator is idempotent — running it
# against an unchanged SoT produces no diff, and CI enforces that via
# .github/workflows/org-profile-drift.yml.
#
# Values MUST match what appears in profile/README.md today, byte-for-byte,
# so the first regeneration is content-neutral.
#
# When any of the following change, edit THIS file, then run:
#     python3 scripts/generate_org_profile.py
#
# and commit both the SoT change and the regenerated README.
#
# Historical narrative sections in profile/README.md
# (Full Production Highlights, Documentation and Community, Release Notes)
# stay literal and are NOT generated from this file.

org: ai-agent-assembly

# ---------------------------------------------------------------------------
# Canonical org-shared metadata (ADR 0014).
# ---------------------------------------------------------------------------
# These sections widen this file from "profile-README source of truth" into the
# org's single canonical registry for non-version shared metadata. Each value
# has exactly ONE owner here — no consumer may re-declare it. The URL values are
# OWNED by ADR 0007/0008 (public domain & host contract); this registry only
# STORES them so they exist once, it does not re-decide them. When ADR 0007/0008
# change a host, update it here in the same change.

# Product / org display identity and the publicly-published contact address.
# The org *slug* is owned by the top-level `org:` key above — not repeated here,
# so a rename has one owner.
product:
  name: "AI Agent Assembly"
  org_display_name: "AI Agent Assembly"
  security_email: "security@agent-assembly.dev"

# Canonical public hosts. Values are owned by ADR 0007/0008 and only stored here.
urls:
  marketing: "https://agent-assembly.com"
  www: "https://www.agent-assembly.com"
  app: "https://app.agent-assembly.com"
  api: "https://api.agent-assembly.com"
  docs: "https://docs.agent-assembly.com"
  status: "https://status.agent-assembly.com"
  # Canonical installer is the apex /install.sh; the .dev host is a kept alternate.
  installer: "https://agent-assembly.com/install.sh"
  installer_alt: "https://tool.agent-assembly.dev"
  # Per-SDK canonical documentation base paths under the docs host.
  docs_sdk_base:
    python: "https://docs.agent-assembly.com/python/"
    node: "https://docs.agent-assembly.com/node/"
    go: "https://docs.agent-assembly.com/go/"

# Governance-doc link contract. `default_branch` is the .github repo's branch
# where the baseline docs live; cross-repo links drift (`main` vs `master`)
# without a single owner. `baseline_doc_base` embeds that branch so consumers
# build blob URLs from one place.
governance:
  default_branch: master
  baseline_doc_base: "https://github.com/ai-agent-assembly/.github/blob/master"

# Public Jira coordination constants (project AAASM). Only already-public IDs
# live here; the Components vocabulary (which mixes private-repo slugs) is
# deliberately NOT stored, per the context-boundary rules.
jira:
  site: "lightning-dust-mite.atlassian.net"
  project_key: AAASM
  project_id: "10006"
  board_id: 7
  # Components is the NATIVE `components` field — customfield_10041 is null on
  # AAASM and must not be used.
  components_field: components
  fields:
    team: customfield_10001
    story_points: customfield_10016
    start_date: customfield_10015
    sprint: customfield_10020

# Repository Status table rows. The generator emits one Markdown table row per
# entry, in this order, inside the "repo_table" bounded section.
#
# Fields:
#   slug            - short repo name for the badge label (e.g. "agent-assembly")
#   repo            - "<org>/<repo>" GitHub slug for URL construction
#   default_branch  - branch used for CI / last-commit / commits URLs
#   visibility      - "public" | "private" — a generated PUBLIC artifact must
#                     never emit a private repo's slug/metadata (ADR 0014). Every
#                     entry here is public; private repos are not listed at all.
#   role            - short human description in the "Purpose" column
#   badge:
#     label_color   - shields.io color for the name badge (hex, no leading #)
#     logo          - shields.io logo id (shields.io "?logo=" value)
#     logo_color    - optional logoColor override (blank = shields default)
#     tag_prefix    - "SDK" / "core" / "tap" / "docs" / "spec" / "examples" /
#                     "org-profile" — appears after the "--" in the badge
#   version:        # cell 3: Version — list of shield markdown fragments
#     - one or more raw badge fragments
#   activity_ci:    # cell 4: Base branch health — CI status badge fragment(s),
#                   #         OR "—" when no CI is applicable
#   activity_meta:  # cell 5: Activity — issues / PRs / last-commit fragments
repos:
  - slug: agent-assembly
    repo: ai-agent-assembly/agent-assembly
    default_branch: master
    role: "Core Rust monorepo: gateway, policy engine, CLI, API, dashboard"
    visibility: public
    badge:
      label_color: "000000"
      logo: rust
      tag_prefix: core
    version:
      - "[![GitHub tag](https://img.shields.io/github/v/tag/ai-agent-assembly/agent-assembly?label=GitHub&logo=github)](https://github.com/ai-agent-assembly/agent-assembly/tags)"
      - "[![crates.io](https://img.shields.io/badge/crates.io-reference-000000?logo=rust)](https://crates.io/search?q=agent-assembly)"
    activity_ci:
      - "[![CI](https://github.com/ai-agent-assembly/agent-assembly/actions/workflows/ci.yml/badge.svg?branch=master)](https://github.com/ai-agent-assembly/agent-assembly/actions/workflows/ci.yml?query=branch%3Amaster)"
    activity_meta:
      - "[![issues](https://img.shields.io/github/issues/ai-agent-assembly/agent-assembly?label=issues)](https://github.com/ai-agent-assembly/agent-assembly/issues)"
      - "[![PRs](https://img.shields.io/github/issues-pr/ai-agent-assembly/agent-assembly?label=PRs)](https://github.com/ai-agent-assembly/agent-assembly/pulls)"
      - "[![last commit](https://img.shields.io/github/last-commit/ai-agent-assembly/agent-assembly?label=last)](https://github.com/ai-agent-assembly/agent-assembly/commits/master)"

  - slug: python-sdk
