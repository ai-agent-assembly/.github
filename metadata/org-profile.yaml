# Install-snippets bounded section. Each channel becomes a "#### <heading>"
# subsection under "### Install channels", followed by a fenced code block
# (language = "sh"), followed by an optional trailing note (rendered as-is).
install_channels:
  - id: homebrew
    heading: "Homebrew (macOS, Linux)"
    lang: sh
    commands:
      - "brew install ai-agent-assembly/tap/aasm"

  - id: python
    heading: "Python — pip, uv, or poetry"
    lang: sh
    commands:
      - "# pip"
      - "pip install agent-assembly"
      - ""
      - "# uv"
      - "uv add agent-assembly"
      - ""
      - "# poetry"
      - "poetry add agent-assembly"

  - id: node
    heading: "Node.js — pnpm (recommended), npm, or yarn"
    lang: sh
    commands:
      - "# pnpm (recommended)"
      - "pnpm add @agent-assembly/sdk"
      - ""
      - "# npm"
      - "npm install @agent-assembly/sdk"
      - ""
      - "# yarn"
      - "yarn add @agent-assembly/sdk"

  - id: go
    heading: "Go — go get"
    lang: sh
    commands:
      - "go get github.com/ai-agent-assembly/go-sdk"

  - id: docker
    heading: "Docker"
    # Prose-only channel — no code block.
    lang: null
    commands: []
    note: |
      > A published container image is coming soon. No image is available on
      > `ghcr.io` yet.

  - id: curl
    heading: "curl one-line installer (CLI)"
    lang: sh
    commands:
      - "curl -sSf https://raw.githubusercontent.com/ai-agent-assembly/agent-assembly/master/scripts/install-cli.sh | sh"
    note: |
      > A short hosted alias (`https://tool.agent-assembly.dev`, the registry's
      > `urls.installer_alt`) is planned but not yet live — use the
      > `raw.githubusercontent.com` URL above for now.
