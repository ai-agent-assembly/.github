# Org starter: Rust CI encoding the 8-principle playbook.
# See the org CONTRIBUTING.md "CI/CD playbook" section for the rationale and
# the measured-result evidence in agent-assembly's
# docs/src/benchmarks/ci-cd-pipeline-performance.md.
name: CI

on:
  push:
    branches: [$default-branch]
    tags: ["v*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/**"

# Principle: cancel superseded runs — but only on PRs, never on
# $default-branch / tag pushes (those must each complete for release safety).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Principle: least privilege at the top level; widen per-job only when needed.
permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Principle: Linux-default. Multi-OS only on $default-branch / tag
        # pushes; PRs run Linux only to save minutes.
        os: ${{ fromJSON((github.event_name == 'push' && (github.ref == 'refs/heads/$default-branch' || startsWith(github.ref, 'refs/tags/'))) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo test --workspace --all-features

  # Principle: single aggregate gate. Make branch protection require only
  # "CI Success"; it fails if any job above failed or was cancelled.
  ci-success:
    name: CI Success
    if: always()
    needs: [lint, test]
    uses: ai-agent-assembly/.github/.github/workflows/ci-success.yml@main
    with:
      needs-json: ${{ toJSON(needs) }}
